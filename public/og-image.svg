<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Yahor Darashkevich - Customer Experience Portfolio</title>
  <desc id="desc">Customer experience consulting portfolio and services by Yahor Darashkevich.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4f4" />
      <stop offset="45%" stop-color="#ede9fe" />
      <stop offset="100%" stop-color="#cffafe" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="220" cy="120" r="120" fill="#d946ef" fill-opacity="0.30" filter="url(#blur)" />
  <circle cx="1030" cy="170" r="150" fill="#6366f1" fill-opacity="0.25" filter="url(#blur)" />
  <circle cx="820" cy="520" r="160" fill="#06b6d4" fill-opacity="0.22" filter="url(#blur)" />

  <rect x="80" y="80" width="1040" height="470" rx="36" fill="#ffffff" fill-opacity="0.45" stroke="#ffffff" stroke-opacity="0.7" />
  <text x="140" y="250" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="700" fill="#0f172a">
    Yahor Darashkevich
  </text>
  <text x="140" y="320" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="500" fill="#334155">
    Customer Experience Consultant
  </text>
  <text x="140" y="390" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="400" fill="#475569">
    Helping businesses scale support and CX operations.
  </text>
</svg>
