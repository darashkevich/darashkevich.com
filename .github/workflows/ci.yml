name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:deps

      - name: Run checks
        run: npm run check

      - name: Build
        run: npm run build

      - name: Smoke (production bundle interactions)
        run: npm run smoke

      - name: Smoke (flights gate — helpers + live apex)
        run: npm run smoke:flights
        env:
          # CI asserts the public Workers origin; skip only if GitHub is offline to CF.
          FLIGHTS_SMOKE_SKIP_LIVE: ${{ vars.FLIGHTS_SMOKE_SKIP_LIVE || '' }}

      - name: Accessibility audit (axe)
        run: |
          npx --yes serve dist -l tcp://127.0.0.1:4173 >/tmp/a11y-serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1 && break
            sleep 0.5
          done
          npx --yes browser-driver-manager@2.0.1 install chrome >/tmp/bdm-install.log
          CHROME_TEST_PATH=""
          CHROMEDRIVER_TEST_PATH=""
          while IFS= read -r line || [[ -n "${line}" ]]; do
            case "${line}" in
              CHROME_TEST_PATH=*)
                CHROME_TEST_PATH="${line#CHROME_TEST_PATH=}"
                CHROME_TEST_PATH="${CHROME_TEST_PATH#\"}"
                CHROME_TEST_PATH="${CHROME_TEST_PATH%\"}"
                ;;
              CHROMEDRIVER_TEST_PATH=*)
                CHROMEDRIVER_TEST_PATH="${line#CHROMEDRIVER_TEST_PATH=}"
                CHROMEDRIVER_TEST_PATH="${CHROMEDRIVER_TEST_PATH#\"}"
                CHROMEDRIVER_TEST_PATH="${CHROMEDRIVER_TEST_PATH%\"}"
                ;;
            esac
          done < <(npx --yes browser-driver-manager@2.0.1 which 2>/dev/null || true)
          export CHROME_BIN="${CHROME_TEST_PATH}"
          # Load delay avoids intermittent false color-contrast failures before CSS settles.
          npx axe http://127.0.0.1:4173/ \
            --chromedriver-path "${CHROMEDRIVER_TEST_PATH}" \
            --chrome-path "${CHROME_TEST_PATH}" \
            --exit \
            --tags wcag2a,wcag2aa \
            --timeout 90 \
            --load-delay 3000
