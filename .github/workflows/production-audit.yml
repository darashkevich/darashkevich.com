name: Production Audit

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  audit-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run production audit checks
        env:
          SITE_URL: https://darashkevich.com
          MAX_RETRIES: "15"
          RETRY_DELAY_SECONDS: "20"
          # Warn-only until www→apex redirect exists and Netlify is noindex/unpublished.
          # HOST_DUP_STRICT=1 was failing every main push + daily schedule (GitHub emails).
          HOST_DUP_STRICT: "0"
        run: bash ./scripts/audit-production.sh
