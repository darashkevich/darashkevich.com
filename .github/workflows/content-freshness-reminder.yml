name: Content Freshness Reminder

on:
  schedule:
    - cron: "0 10 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  open-monthly-seo-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Create monthly reminder issue
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = "seo-maintenance";
            const month = new Date().toISOString().slice(0, 7); // YYYY-MM
            const title = `SEO Content Freshness Review - ${month}`;

            // Ensure label exists
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: "0e8a16",
                  description: "Monthly SEO content freshness and indexing review"
                });
              } else {
                throw error;
              }
            }

            // Avoid duplicates for current month
            const openIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: label,
              per_page: 100
            });

            const alreadyExists = openIssues.data.some((issue) => issue.title === title);
            if (alreadyExists) {
              core.info(`Issue already exists for ${month}. Skipping.`);
              return;
            }

            const body = [
              "## Monthly SEO + performance checklist",
              "",
              "- [ ] Publish or update at least 1 high-intent page/post",
              "- [ ] Review Search Console performance for top queries/pages",
              "- [ ] Refresh metadata/CTR copy on lowest-CTR high-impression pages",
              "- [ ] Confirm sitemap and IndexNow submission after content updates",
              "- [ ] Add/update at least 2 internal links to new or refreshed content",
              "- [ ] Validate analytics conversions (Calendly, email, resume download)",
              "- [ ] Run PageSpeed Insights (mobile + desktop) on https://darashkevich.com/",
              "- [ ] Note LCP / INP / CLS; fix regressions if Core Web Vitals slip",
              "",
              "PSI: https://pagespeed.web.dev/analysis?url=https%3A%2F%2Fdarashkevich.com%2F",
              "Reference template: `templates/seo-landing-page-template.md`"
            ].join("\n");

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: [label]
            });
